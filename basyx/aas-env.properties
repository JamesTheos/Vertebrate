# Eclipse BaSyx v2 AAS Environment configuration (mounted into the container).
# In-memory backend: shells/submodels live only as long as the container runs
# (persistence is a documented follow-up).
server.port=8081
basyx.backend=InMemory

# Allow the AAS Web UI (browser, :3000) and the Vertebrate app to call this
# environment cross-origin.  '*' is fine for a local/dev stack.
basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
