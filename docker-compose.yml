services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    logging:
      driver: "none"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    # On a quick restart Zookeeper still holds the old broker registration for a few seconds and
    # Kafka exits; restarting it until the registration has expired brings it back on its own.
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertebrate
      POSTGRES_PASSWORD: vertebrate
      POSTGRES_DB: vertebrate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertebrate"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  # ---- AAS (optional): docker compose --profile sim --profile aas up --build -d
  # with BASYX_AAS_ENV_URL=http://aas-environment:8081 to turn the "Push to BaSyx" sync on.
  # Eclipse BaSyx v2 AAS Environment — hosts the AAS + Submodel repositories and
  # exposes the standardized DotAAS Part 2 REST API.  The app pushes shells here
  # via the "Push to BaSyx" button (POST /api/aas/sync).  In-memory backend, so
  # contents are lost on restart (persistence is a follow-up).
  # Host port 8082: 8081 is the PLC simulator's status page.
  aas-environment:
    profiles: ["aas"]
    image: eclipsebasyx/aas-environment:2.0.0-milestone-11
    ports:
      - "8082:8081"
    volumes:
      - ./basyx/aas-env.properties:/application/application.properties

  # Eclipse BaSyx v2 AAS Web UI — browse the synced shells/submodels at :3000.
  # Endpoints point at the host-mapped environment port (the browser reaches it
  # on localhost:8082).  Registry/discovery omitted: registry-less, the UI reads
  # the AAS repo directly.  No release tags exist for aas-gui, so a SNAPSHOT is pinned.
  aas-ui:
    profiles: ["aas"]
    image: eclipsebasyx/aas-gui:SNAPSHOT-20260619-062218-125f56f
    depends_on:
      - aas-environment
    ports:
      - "3000:3000"
    environment:
      AAS_REPO_PATH: "http://localhost:8082/shells"
      SUBMODEL_REPO_PATH: "http://localhost:8082/submodels"
      CD_REPO_PATH: "http://localhost:8082/concept-descriptions"

  vertebrate-app:
    build: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      KAFKASERVER: kafka:29092
      IN_DOCKER: "true"
      DATABASE_URL: postgresql+psycopg2://vertebrate:vertebrate@db:5432/vertebrate
      SHOW_CHATBOT: ${SHOW_CHATBOT:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}   # demo: idle tab stays logged in
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://plc-sim:4840}     # PLC endpoint for the dashboard health check
      # Set SECRET_KEY in your shell/.env for stable sessions; empty → the app
      # generates an ephemeral key (sessions won't survive a restart).
      SECRET_KEY: ${SECRET_KEY:-}
      # BaSyx environment for the AAS sync (profile aas: http://aas-environment:8081); blank disables sync.
      BASYX_AAS_ENV_URL: ${BASYX_AAS_ENV_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # PLC on the Docker host (Linux; Desktop has it built in)
    ports:
      - "5001:5001"
    volumes:
      - ./code/instance:/app/code/instance

  # ---- Test runner (all tests run in Docker): docker compose --profile test run --rm tests
  # Mounts ./code, so the current working tree is tested without rebuilding. SQLite in-memory,
  # Kafka disabled; never touches the dev database. Postgres-only tests: see AGENTS.md.
  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        BUILD_ENV: dev
    environment:
      DISABLE_KAFKA: "1"
      SQLALCHEMY_DATABASE_URI: ${TEST_DATABASE_URL:-sqlite:///:memory:}
    volumes:
      - ./code:/app/code
    working_dir: /app/code
    command: ["python", "-m", "pytest"]

  # ---- PLC modes ---------------------------------------------------------------------------
  # A) real/virtual CODESYS PLC:  OPCUA_URL=opc.tcp://<plc-host>:4840 docker compose --profile plc up --build -d
  # B) simulator (no PLC):        docker compose --profile sim up --build -d
  plc-sim:
    profiles: ["sim"]
    build: ./plc-sim
    environment:
      PRESSURE_OFFSET: "8.5"   # demo: keeps pressure positive on camera (Sim 1 6–14, Sim 2 0.5–16.5 bar)
    ports:
      - "4840:4840"   # OPC UA, same node IDs as the CODESYS project
      - "8081:8081"   # status page
    restart: unless-stopped

  plc2nexus:
    profiles: ["sim", "plc"]
    build:
      context: .
      dockerfile: Dockerfile.bridges
    command: ["python", "PLC2Nexus.py"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKASERVER: kafka:29092
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://plc-sim:4840}   # B: simulator; A: set OPCUA_URL to the real PLC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nexus2plc:
    profiles: ["sim", "plc"]
    build:
      context: .
      dockerfile: Dockerfile.bridges
    command: ["python", "Nexus2PLC.py"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKASERVER: kafka:29092
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://plc-sim:4840}   # B: simulator; A: set OPCUA_URL to the real PLC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  db_data:
